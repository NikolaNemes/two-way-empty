stages: [mirror]

mirror-to-github:
  stage: mirror
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
  resource_group: mirror-develop
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    MIRROR_TARGET_URL: git@github.com:NikolaNemes/two-way-empty.git
    BRANCH: develop
  before_script:
    - apk add --no-cache git openssh-client bash
  script:
    - bash ./sync.sh
